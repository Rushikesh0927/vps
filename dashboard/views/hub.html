<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rushi's Server Hub - Admin</title>
    <meta name="theme-color" content="#08090c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<div id="page-hub" class="page active">
    <nav class="hub-nav">
        <div class="hub-nav-left">
            <svg class="nav-logo" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#grad1)" stroke-width="2"><defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#6C5CE7"/><stop offset="100%" style="stop-color:#00D2FF"/></linearGradient></defs><path d="M12 2 4 6v6c0 5 3.4 8.3 8 10 4.6-1.7 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>
            <span class="hub-brand">Rushi's Hub</span>
        </div>
        <div class="hub-nav-right">
            <div class="user-chip" id="hub-user-chip">
                <img id="hub-user-avatar" class="user-avatar" src="" alt="" onerror="this.style.display='none'">
                <span id="hub-user-name"></span>
                <button class="btn-icon" onclick="logout()" title="Sign out">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- System Overview -->
    <section class="system-overview" id="system-overview" style="display:none;">
        <div class="stat-card clickable" onclick="showBreakdown('cpu')">
            <div class="stat-ring"><svg viewBox="0 0 100 100"><circle class="stat-ring-bg" cx="50" cy="50" r="42"/><circle class="stat-ring-fill" cx="50" cy="50" r="42" id="ring-cpu"/></svg><span class="stat-ring-val" id="val-cpu">0%</span></div>
            <div class="stat-label">CPU<span class="stat-sub" id="sub-cpu">8 cores</span><span class="stat-link">View usage</span></div>
        </div>
        <div class="stat-card clickable" onclick="showBreakdown('ram')">
            <div class="stat-ring"><svg viewBox="0 0 100 100"><circle class="stat-ring-bg" cx="50" cy="50" r="42"/><circle class="stat-ring-fill" cx="50" cy="50" r="42" id="ring-ram"/></svg><span class="stat-ring-val" id="val-ram">0%</span></div>
            <div class="stat-label">RAM<span class="stat-sub" id="sub-ram">0 / 0 GB</span><span class="stat-link">View usage</span></div>
            <button class="btn-xs btn-clear-cache" onclick="event.stopPropagation(); clearCache(this)">Clear Cache</button>
        </div>
        <div class="stat-card clickable" onclick="showBreakdown('disk')">
            <div class="stat-ring"><svg viewBox="0 0 100 100"><circle class="stat-ring-bg" cx="50" cy="50" r="42"/><circle class="stat-ring-fill" cx="50" cy="50" r="42" id="ring-disk"/></svg><span class="stat-ring-val" id="val-disk">0%</span></div>
            <div class="stat-label">Disk<span class="stat-sub" id="sub-disk">0 / 0 GB</span><span class="stat-link">View usage</span></div>
        </div>
        <div class="stat-card">
            <div class="stat-ring"><svg viewBox="0 0 100 100"><circle class="stat-ring-bg" cx="50" cy="50" r="42"/><circle class="stat-ring-fill gdrive-ring" cx="50" cy="50" r="42" id="ring-gdrive"/></svg><span class="stat-ring-val" id="val-gdrive">0%</span></div>
            <div class="stat-label">Google Drive<span class="stat-sub" id="sub-gdrive">0 / 0 GB</span></div>
        </div>
    </section>

    <!-- Container Grid -->
    <section class="hub-section">
        <div class="section-head">
            <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg> Containers</h2>
        </div>
        <div class="container-grid" id="container-grid">
            <div class="container-loading">Loading containers...</div>
        </div>
    </section>

    <!-- User Management (Admin only) -->
    <section class="hub-section" id="user-management-section" style="display:none;">
        <div class="section-head">
            <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> User Management</h2>
            <button class="btn-sm btn-accent" onclick="showAddUserModal()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                Add User
            </button>
        </div>
        <div class="users-table-wrap">
            <table class="users-table" id="users-table">
                <thead><tr><th>User</th><th>Role</th><th>Containers</th><th>Last Login</th><th>Actions</th></tr></thead>
                <tbody id="users-tbody"></tbody>
            </table>
        </div>
    </section>
</div>

<!-- Add User Modal -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h3 id="modal-title">Add User</h3>
        <div class="input-group">
            <label for="modal-email">Google Email</label>
            <input type="email" id="modal-email" placeholder="user@gmail.com" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="modal-role">Role</label>
            <select id="modal-role">
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <div class="input-group">
            <label>Container Access</label>
            <div id="modal-containers" class="checkbox-group"></div>
        </div>
        <input type="hidden" id="modal-user-id" value="">
        <div class="modal-actions">
            <button class="btn-sm btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn-sm btn-accent" onclick="saveUser()">Save</button>
        </div>
    </div>
</div>

<!-- Breakdown Modal -->
<div id="breakdown-modal" class="modal-overlay" onclick="closeBreakdown()">
    <div class="modal-card modal-large" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="breakdown-title">Usage Breakdown</h3>
            <button class="btn-icon" onclick="closeBreakdown()">✕</button>
        </div>
        <div class="breakdown-list" id="breakdown-list">
            Loading...
        </div>
    </div>
</div>

<script src="common.js?v=11"></script>
<script src="hub.js?v=11"></script>
</body>
</html>
